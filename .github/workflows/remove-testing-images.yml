name: Remove testing image versions

on:
  workflow_dispatch:
    inputs:
      expected_latest_digest:
        description: Verified digest of the published arma-3-yolk-connall latest image
        required: true
        type: string

jobs:
  remove-testing:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EXPECTED_LATEST_DIGEST: ${{ inputs.expected_latest_digest }}
    steps:
      - name: Verify latest before removing testing-only versions
        shell: bash
        run: |
          [[ "$EXPECTED_LATEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          latest=$(gh api /users/ConnallMcCarthy/packages/container/arma-3-yolk-connall/versions --paginate --jq '.[] | select(.metadata.container.tags | index("latest")) | .name')
          [[ "$latest" == "$EXPECTED_LATEST_DIGEST" ]]
          for package in arma-3-yolk-connall arma3-yolk-connall; do
            gh api "/users/ConnallMcCarthy/packages/container/$package/versions" --paginate --jq '.[] | select(.metadata.container.tags == ["testing"]) | .id' > "$RUNNER_TEMP/testing-versions.txt"
            while IFS= read -r version; do
              # Recheck tags immediately before deletion to preserve other releases.
              tags=$(gh api "/users/ConnallMcCarthy/packages/container/$package/versions/$version" --jq '.metadata.container.tags | @json')
              if [[ "$tags" != '["testing"]' ]]; then
                echo "Preserving $package version $version with tags $tags"
                continue
              fi
              gh api --method DELETE "/users/ConnallMcCarthy/packages/container/$package/versions/$version"
              echo "Removed $package testing-only version $version"
            done < "$RUNNER_TEMP/testing-versions.txt"
            remaining=$(gh api "/users/ConnallMcCarthy/packages/container/$package/versions" --paginate --jq '.[] | select(.metadata.container.tags | index("testing")) | .id')
            if [[ -n "$remaining" ]]; then
              echo "::error::Testing tags remain on $package versions: $remaining"
              exit 1
            fi
          done
